<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes computer-use demo form</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #14161a;
    color: #e8e8ea;
    font: 20px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: min(820px, 90vw); padding: 48px 0; }
  h1 { font-size: 34px; margin: 0 0 8px; }
  p.lead { color: #a6a8ad; margin: 0 0 36px; }
  label { display: block; margin: 22px 0 8px; font-weight: 600; }
  input[type="text"], input[type="email"], textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 14px 16px;
    border: 1px solid #3a3e46;
    border-radius: 8px;
    background: #1d2026;
    color: inherit;
    font: inherit;
  }
  textarea { min-height: 120px; resize: vertical; }
  fieldset { margin: 28px 0 0; padding: 0; border: 0; }
  legend { font-weight: 600; margin-bottom: 10px; }
  .choice { display: flex; gap: 12px; align-items: center; margin: 12px 0; }
  .choice input { width: 22px; height: 22px; accent-color: #7aa2ff; }
  button {
    margin-top: 32px;
    padding: 14px 28px;
    border: 0;
    border-radius: 8px;
    background: #7aa2ff;
    color: #0d1016;
    font: 600 20px system-ui, sans-serif;
    cursor: pointer;
  }
  #done { display: none; padding: 24px; border: 1px solid #2f6f4f; border-radius: 10px; background: #16241c; }
  #done strong { color: #7ddca4; }
</style>
</head>
<body>
<main>
  <h1>Demo registration</h1>
  <p class="lead">A local form for recording the Hyprland computer-use demo.</p>

  <form id="form">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" autocomplete="off" placeholder="Ada Lovelace">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="off" placeholder="ada@example.com">

    <fieldset>
      <legend>Plan</legend>
      <label class="choice"><input type="radio" name="plan" value="starter"> Starter</label>
      <label class="choice"><input type="radio" name="plan" value="team"> Team</label>
      <label class="choice"><input type="radio" name="plan" value="enterprise"> Enterprise</label>
    </fieldset>

    <label for="comments">Comments</label>
    <textarea id="comments" name="comments" placeholder="Anything else?"></textarea>

    <button type="submit">Submit registration</button>
  </form>

  <div id="done" role="status">
    <strong>Response recorded.</strong>
    <div>You may close this page.</div>
  </div>
</main>

<script>
  document.getElementById("form").addEventListener("submit", (event) => {
    event.preventDefault();
    document.getElementById("form").style.display = "none";
    document.getElementById("done").style.display = "block";
  });
</script>
</body>
</html>
